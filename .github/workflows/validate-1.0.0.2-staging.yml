name: Validate Flutter 1.0.0.2 staging
on:
  push:
    branches:
      - staging/release-1.0.0.2-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging isolation and source availability
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging/release-1.0.0.2-build"
          echo "Staging validation only; no deploy steps."
          if [ -f pubspec.yaml ]; then
            echo "Flutter source exists at repository root."
          else
            echo "::warning::Flutter source not present in GitHub branch. Upload reviewed source before build."
          fi
      - name: Build Flutter web if source exists
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Compile Flutter web
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
      - name: Upload staging artifact
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gelye-cafe-rest-1.0.0.2-staging-web
          path: build/web/
          if-no-files-found: error
