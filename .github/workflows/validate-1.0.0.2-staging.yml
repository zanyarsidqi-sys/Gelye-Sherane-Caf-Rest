name: Validate Flutter 1.0.0.2 recovery
on:
  push:
    branches:
      - fix/auth-production-key
      - staging/release-1.0.0.2-recovery
      - fix/release-1.0.0.2-ci-deploy
      - fix/production-analyze-policy
      - fix/preflight-current-workflow-paths
      - fix/release-version-script-workflow-paths
      - fix/production-verification-user-agent
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require complete Flutter source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/auth-production-key" || \
            test "$GITHUB_REF_NAME" = "staging/release-1.0.0.2-recovery" || \
            test "$GITHUB_REF_NAME" = "fix/release-1.0.0.2-ci-deploy" || \
            test "$GITHUB_REF_NAME" = "fix/production-analyze-policy" || \
            test "$GITHUB_REF_NAME" = "fix/preflight-current-workflow-paths" || \
            test "$GITHUB_REF_NAME" = "fix/release-version-script-workflow-paths" || \
            test "$GITHUB_REF_NAME" = "fix/production-verification-user-agent"
          for f in pubspec.yaml lib/main.dart web/index.html; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
      - name: Require 35 sections and tests
        shell: bash
        run: |
          set -euo pipefail
          count=$(find lib/sections -maxdepth 1 -type f -name '*.dart' | wc -l)
          test "$count" -eq 35 || { echo "::error::Expected exactly 35 section files, found $count"; exit 1; }
          test -n "$(find test -type f -name '*_test.dart' -print -quit)" || { echo "::error::Missing Flutter tests"; exit 1; }
          grep -Eq '^version: [0-9]+[.][0-9]+[.][0-9]+[+][0-9]+' pubspec.yaml || { echo "::error::Invalid version"; exit 1; }
      - name: Reject committed private key files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519|.*[.]pem|.*[.]p12|.*[.]pfx)$'; then
            echo "::error::Potential private key committed"
            exit 1
          fi
      - name: Run release source checks
        run: |
          python3 tools/staging_release_preflight.py
          python3 tools/check_release_version.py
          for test_file in release/test_*.py; do python3 "$test_file"; done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies and analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Compile Flutter web
        run: flutter build web --release --dart-define-from-file=config/supabase.public.json --dart-define="APP_RELEASE_VERSION=$(cat release/VERSION)"
      - name: Verify production key without logging in or deploying
        env:
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
        run: python3 tools/check_auth_configuration.py
      - name: Verify compiled web files
        run: |
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          find build/web -name 'main.dart.js' -size +0c | grep -q .
      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: gelye-cafe-rest-1.0.0.2-recovery-web
          path: build/web/
          if-no-files-found: error
