name: Deploy Flutter preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Reassemble and verify Flutter preview
        run: |
          cat preview-parts/part-*.b64 | base64 --decode > preview.tar.gz
          echo 'cc02871149d7b38e41f0fbec35d49cea74b55a8dce2770774359c8d89e9fe8cf  preview.tar.gz' | sha256sum --check
          tar -xzf preview.tar.gz
          node --check site/main.*.dart.js
          node --check site/flutter_bootstrap.js
      - uses: actions/configure-pages@v5
        id: pages
      - name: Apply hosting base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('site/index.html')
          base = os.environ.get('PAGES_BASE_PATH', '').rstrip('/') + '/'
          text, count = re.subn(r'<base href="[^"]*">', '<base href="' + base + '">', p.read_text())
          assert count == 1
          p.write_text(text)
          print('Flutter base path:', base)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
