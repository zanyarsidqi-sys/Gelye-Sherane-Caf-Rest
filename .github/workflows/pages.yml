name: Deploy Gelye Sherane production
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Must exactly match release/VERSION
        required: true
        type: string
      confirm_production:
        description: Type DEPLOY <version> TO PRODUCTION
        required: true
        type: string
      backend_ready:
        description: Production database, Edge Function, VAPID, and dispatch setup are verified
        required: true
        type: boolean
        default: false
      staging_smoke_tests_passed:
        description: The candidate passed the required staging browser and device checks
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
      PRODUCTION_CONFIRMATION: ${{ inputs.confirm_production }}
      BACKEND_READY: ${{ inputs.backend_ready }}
      STAGING_SMOKE_TESTS_PASSED: ${{ inputs.staging_smoke_tests_passed }}
      PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF }}
      PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
      PRODUCTION_WEB_PUSH_PUBLIC_KEY: ${{ vars.PRODUCTION_WEB_PUSH_PUBLIC_KEY }}
    outputs:
      release_version: ${{ steps.release_gate.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          cache: true
      - name: Require explicit release confirmation and valid production config
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Production deploys must run from main."; exit 1; }
          RELEASE_VERSION="$(tr -d '\r\n' < release/VERSION)"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release/VERSION."; exit 1; }
          [[ "$REQUESTED_RELEASE_VERSION" == "$RELEASE_VERSION" ]] || { echo "::error::Requested version does not match release/VERSION."; exit 1; }
          [[ "$PRODUCTION_CONFIRMATION" == "DEPLOY $RELEASE_VERSION TO PRODUCTION" ]] || { echo "::error::Type the exact production confirmation phrase."; exit 1; }
          [[ "$BACKEND_READY" == "true" ]] || { echo "::error::Production backend readiness was not confirmed."; exit 1; }
          [[ "$STAGING_SMOKE_TESTS_PASSED" == "true" ]] || { echo "::error::Staging smoke tests were not confirmed."; exit 1; }
          [[ "$PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Invalid production Supabase project ref."; exit 1; }
          [[ "$PRODUCTION_SUPABASE_URL" == "https://${PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF}.supabase.co" ]] || { echo "::error::Production Supabase URL and project ref do not match."; exit 1; }
          [[ -n "$PRODUCTION_SUPABASE_ANON_KEY" ]] || { echo "::error::Missing production Supabase publishable key."; exit 1; }
          [[ -n "$PRODUCTION_WEB_PUSH_PUBLIC_KEY" ]] || { echo "::error::Missing production Web Push public key."; exit 1; }
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
          printf 'release_version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Prevent duplicate or downgrade deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            "https://cafe.gelyesheranecompany.com/release.json?preflight=${GITHUB_RUN_ID}" \
            --output "$RUNNER_TEMP/current-release.json"
          python3 - "$RELEASE_VERSION" "$RUNNER_TEMP/current-release.json" <<'PY'
          import json, re, sys
          candidate = sys.argv[1]
          current = json.load(open(sys.argv[2], encoding="utf-8"))["version"]
          pattern = re.compile(r"^\d+(?:\.\d+){3}$")
          if not pattern.fullmatch(candidate) or not pattern.fullmatch(current):
              raise SystemExit("Candidate or live version is not a four-part version.")
          if tuple(map(int, candidate.split("."))) <= tuple(map(int, current.split("."))):
              raise SystemExit(f"Refusing duplicate/downgrade deployment: live={current}, candidate={candidate}")
          print(f"Version guard passed: {current} -> {candidate}")
          PY
      - name: Run release preflight and static regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/staging_release_preflight.py
          python3 tools/check_release_version.py
          node --check web/push_client.js
          node release/test_push_empty_response.js
          node release/test_push_dispatch_policy.mjs
          for test_file in release/test_*.py; do python3 "$test_file"; done
      - name: Resolve Flutter dependencies, analyze, and test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build production Flutter web app
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release \
            --dart-define="APP_RELEASE_VERSION=$RELEASE_VERSION" \
            --dart-define="SUPABASE_URL=$PRODUCTION_SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$PRODUCTION_SUPABASE_ANON_KEY" \
            --dart-define="SUPABASE_EXPECTED_PROJECT_REF=$PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF" \
            --dart-define="WEB_PUSH_PUBLIC_KEY=$PRODUCTION_WEB_PUSH_PUBLIC_KEY"
      - name: Write and verify deployed version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RELEASE_VERSION" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          root = Path("build/web")
          version = sys.argv[1]
          mains = [p for p in root.glob("main*.js")
                   if p.name == "main.dart.js" or (p.name.startswith("main.") and p.name.endswith(".dart.js"))]
          if len(mains) != 1:
              raise SystemExit(f"Expected one Flutter main JS bundle, found {len(mains)}.")
          main = mains[0]
          content = main.read_bytes()
          if version.encode() not in content:
              raise SystemExit("Built JavaScript does not contain the requested release version.")
          flutter_version = subprocess.check_output(["flutter", "--version"], text=True).splitlines()[0]
          release = {
              "version": version,
              "main": main.name,
              "sha256": hashlib.sha256(content).hexdigest(),
              "built_with": flutter_version,
          }
          (root / "release.json").write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")
          (root / "release-version.txt").write_text(version + "\n", encoding="utf-8")
          (root / ".nojekyll").touch()
          assert json.loads((root / "release.json").read_text())["version"] == version
          assert (root / "release-version.txt").read_text().strip() == version
          PY
      - name: Verify release artifact before handing it to deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RELEASE_VERSION" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          root = Path("build/web")
          version = sys.argv[1]
          release = json.loads((root / "release.json").read_text(encoding="utf-8"))
          main = release.get("main", "")
          if not re.fullmatch(r"main(?:\.[A-Za-z0-9_-]+)?\.dart\.js", main):
              raise SystemExit("Invalid Flutter bundle path in release.json.")
          if release.get("version") != version:
              raise SystemExit("Artifact release.json version mismatch.")
          if (root / "release-version.txt").read_text(encoding="utf-8").strip() != version:
              raise SystemExit("Artifact release-version.txt mismatch.")
          if hashlib.sha256((root / main).read_bytes()).hexdigest() != release.get("sha256"):
              raise SystemExit("Artifact JavaScript bundle SHA-256 mismatch.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gelye-cafe-rest-production-web
          path: build/web/
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gelye-cafe-rest-production-web
          path: build/web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/
          if-no-files-found: error
      - name: Deploy approved production artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site serves the deployed version and bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RELEASE_VERSION" "$GITHUB_RUN_ID" <<'PY'
          import hashlib, json, re, sys, time, urllib.error, urllib.request
          version, run_id = sys.argv[1:3]
          base = "https://cafe.gelyesheranecompany.com/"
          headers = {"Cache-Control": "no-cache"}
          last_error = "Live version did not match the deployment."
          for attempt in range(18):
              try:
                  def get(path):
                      request = urllib.request.Request(base + path + f"?deployment={run_id}", headers=headers)
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.read()
                  metadata = json.loads(get("release.json"))
                  marker = get("release-version.txt").decode().strip()
                  main = metadata.get("main", "")
                  if not re.fullmatch(r"main(?:\.[A-Za-z0-9_-]+)?\.dart\.js", main):
                      raise ValueError("Live release manifest has an invalid bundle path.")
                  bundle = get(main)
                  digest = hashlib.sha256(bundle).hexdigest()
                  if metadata.get("version") == version and marker == version and digest == metadata.get("sha256"):
                      print(f"Verified live release {version} at {base}")
                      raise SystemExit(0)
                  last_error = f"Observed manifest={metadata.get('version')}, marker={marker}, bundle_sha_matches={digest == metadata.get('sha256')}."
              except (OSError, ValueError, KeyError, urllib.error.URLError) as error:
                  last_error = str(error)
              time.sleep(10)
          raise SystemExit(f"Production deploy completed, but live verification failed: {last_error}")
          PY
