name: Deploy Gelye Sherane release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Reassemble and verify release 1.0.0.1
        run: |
          cat release-parts/1.0.0.1/part-*.b64 | base64 --decode > release-1.0.0.1.tar.xz
          echo 'd43f13fc0471f3ee0652df05e2e6e5c7bb397da4ab320bd7401228dc0bb7fe5d  release-1.0.0.1.tar.xz' | sha256sum --check
          tar -xJf release-1.0.0.1.tar.xz
          node --check site/main.*.dart.js
          node --check site/flutter_bootstrap.js
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('site'); release=json.loads((root/'release.json').read_text())
          assert release['version']=='1.0.0.1'
          assert hashlib.sha256((root/release['main']).read_bytes()).hexdigest()==release['sha256']
          assert '<base href="/">' in (root/'index.html').read_text()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish GitHub release after deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view 1.0.0.1 >/dev/null 2>&1; then
            gh release create 1.0.0.1 release-1.0.0.1.tar.xz --target "$GITHUB_SHA" --title 'Release 1.0.0.1' --notes-file RELEASE_1.0.0.1.md
          fi
