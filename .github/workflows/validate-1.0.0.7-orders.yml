name: Validate Gelye 1.0.0.7 Table Orders candidate
on:
  push:
    branches:
      - staging/release-1.0.0.7-orders
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the Table Orders candidate and complete source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging/release-1.0.0.7-orders"
          test "$(tr -d '\r\n' < release/VERSION)" = "1.0.0.7"
          for f in pubspec.yaml lib/main.dart web/index.html config/supabase.public.json \
                   supabase/migrations/20261013_1500_table_floor_names.sql \
                   supabase/migrations/20261013_1501_customer_table_order_review.sql; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          count=$(find lib/sections -maxdepth 1 -type f -name '*.dart' | wc -l)
          test "$count" -eq 35 || { echo "::error::Expected 35 sections, found $count"; exit 1; }
          test -n "$(find test -type f -name '*_test.dart' -print -quit)"
      - name: Reject committed private key files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519|.*[.]pem|.*[.]p12|.*[.]pfx)$'; then
            echo "::error::Potential private key committed"
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          cache: true
      - name: Run release source checks
        run: |
          set -euo pipefail
          python3 tools/staging_release_preflight.py
          python3 tools/check_release_version.py
          for test_file in release/test_*.py; do python3 "$test_file"; done
      - name: Resolve dependencies and analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build Table Orders candidate for web
        run: |
          flutter build web --release \
            --dart-define-from-file=config/supabase.public.json \
            --dart-define="APP_RELEASE_VERSION=1.0.0.7"
      - name: Validate production Supabase configuration without signing in or deploying
        env:
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
        run: python3 tools/check_auth_configuration.py
      - name: Verify compiled web files
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          find build/web -name 'main.dart.js' -size +0c | grep -q .
      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: gelye-cafe-rest-1.0.0.7-orders-staging-web
          path: build/web/
          if-no-files-found: error
          retention-days: 1
