name: Validate Gelye 1.0.0.15 Kitchen consolidation (staging)

on:
  push:
    branches:
      - staging/release-1.0.0.15-kitchen-consolidation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require candidate version and merged section count
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging/release-1.0.0.15-kitchen-consolidation"
          test "$(tr -d '\r\n' < release/VERSION)" = "1.0.0.15"
          source_count=$(find lib/sections -maxdepth 1 -type f -name '*.dart' | wc -l)
          test "$source_count" -eq 35
          registry_count=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("lib/app/section_registry.dart").read_text(encoding="utf-8")
          print(len(re.findall(r"^\s*CafeSection\(", text, re.MULTILINE)))
          PY
          )
          test "$registry_count" -eq 26 || {
            echo "::error::Expected 26 visible sections, found $registry_count"
            exit 1
          }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          cache: true

      - name: Run release, migration, permission, and security checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/staging_release_preflight.py
          python3 tools/check_release_version.py
          for test_file in release/test_*.py; do python3 "$test_file"; done

      - name: Analyze and test Flutter application
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Check isolated staging configuration
        id: staging_config
        shell: bash
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.STAGING_SUPABASE_EXPECTED_PROJECT_REF }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_SUPABASE_URL" ||
                -z "$STAGING_SUPABASE_EXPECTED_PROJECT_REF" ||
                -z "$STAGING_SUPABASE_ANON_KEY" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Staging web artifact not produced"
              echo "Flutter source checks ran, but isolated staging variables are missing."
              echo "No backend-connected artifact or device-smoke claim is produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$STAGING_SUPABASE_EXPECTED_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$STAGING_SUPABASE_URL" == "https://${STAGING_SUPABASE_EXPECTED_PROJECT_REF}.supabase.co" ]]
          [[ -n "$PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF" ]]
          [[ "$STAGING_SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF" ]]
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Verify public Menu service on isolated staging
        if: steps.staging_config.outputs.available == 'true'
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "apikey: $STAGING_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$STAGING_SUPABASE_URL/rest/v1/rpc/gs_menu_public_catalog" >/dev/null

      - name: Build 1.0.0.15 against isolated staging
        if: steps.staging_config.outputs.available == 'true'
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.STAGING_SUPABASE_EXPECTED_PROJECT_REF }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --dart-define="APP_RELEASE_VERSION=1.0.0.15" \
            --dart-define="SUPABASE_URL=$STAGING_SUPABASE_URL" \
            --dart-define="SUPABASE_EXPECTED_PROJECT_REF=$STAGING_SUPABASE_EXPECTED_PROJECT_REF" \
            --dart-define="SUPABASE_ANON_KEY=$STAGING_SUPABASE_ANON_KEY"

      - name: Write and verify canonical staging release metadata
        if: steps.staging_config.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/web")
          version = Path("release/VERSION").read_text(encoding="utf-8").strip()
          if version != "1.0.0.15":
              raise SystemExit("Candidate version mismatch.")
          mains = [p for p in root.glob("main*.js")
                   if p.name == "main.dart.js" or (p.name.startswith("main.") and p.name.endswith(".dart.js"))]
          if len(mains) != 1:
              raise SystemExit(f"Expected one Flutter bundle, found {len(mains)}.")
          main = mains[0]
          content = main.read_bytes()
          if version.encode() not in content:
              raise SystemExit("Built JavaScript does not contain candidate version.")
          manifest = {
              "version": version,
              "main": main.name,
              "sha256": hashlib.sha256(content).hexdigest(),
              "built_with": subprocess.check_output(["flutter", "--version"], text=True).splitlines()[0],
          }
          (root / "release.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          (root / "release-version.txt").write_text(version + "\n", encoding="utf-8")
          (root / ".nojekyll").touch()
          version_file = root / "version.json"
          metadata = json.loads(version_file.read_text(encoding="utf-8"))
          metadata["version"] = version
          version_file.write_text(json.dumps(metadata, separators=(",", ":")) + "\n", encoding="utf-8")
          if hashlib.sha256(main.read_bytes()).hexdigest() != manifest["sha256"]:
              raise SystemExit("Staging JavaScript SHA-256 mismatch.")
          PY

      - name: Upload isolated staging artifact
        if: steps.staging_config.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gelye-cafe-rest-1.0.0.15-kitchen-staging-web
          path: build/web/
          if-no-files-found: error
          retention-days: 1
