name: Validate Gelye 1.0.0.13 Tables workspace

on:
  push:
    branches:
      - staging/release-1.0.0.13-tables
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the 1.0.0.13 candidate and 34-section catalog
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging/release-1.0.0.13-tables"
          test "$(tr -d '\r\n' < release/VERSION)" = "1.0.0.13"
          count=$(find lib/sections -maxdepth 1 -type f -name '*.dart' | wc -l)
          test "$count" -eq 35 || { echo "::error::Expected 35 section source files, found $count"; exit 1; }
          test -f release/test_tables_orders_consolidation.py
          test -f test/dashboard_metric_access_test.dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          cache: true

      - name: Run source, security-boundary, and release contract checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/staging_release_preflight.py
          python3 tools/check_release_version.py
          for test_file in release/test_*.py; do python3 "$test_file"; done

      - name: Resolve Flutter dependencies, analyze, and test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Require isolated staging configuration before a web artifact
        id: staging_config
        shell: bash
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.STAGING_SUPABASE_EXPECTED_PROJECT_REF }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_SUPABASE_URL" || -z "$STAGING_SUPABASE_EXPECTED_PROJECT_REF" || -z "$STAGING_SUPABASE_ANON_KEY" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Staging artifact not produced"
              echo "Flutter checks ran, but isolated staging Supabase variables are not configured."
              echo "No backend-connected artifact or staging smoke-test claim is produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$STAGING_SUPABASE_EXPECTED_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Invalid staging Supabase project ref."; exit 1; }
          [[ "$STAGING_SUPABASE_URL" == "https://${STAGING_SUPABASE_EXPECTED_PROJECT_REF}.supabase.co" ]] || { echo "::error::Staging Supabase URL and project ref do not match."; exit 1; }
          [[ -n "$PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF" ]] || { echo "::error::Production project ref is missing; staging isolation cannot be proven."; exit 1; }
          [[ "$STAGING_SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_SUPABASE_EXPECTED_PROJECT_REF" ]] || { echo "::error::Staging and production project refs must differ."; exit 1; }
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Verify the public Menu catalog exists in isolated staging
        if: steps.staging_config.outputs.available == 'true'
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error \
            -H "apikey: $STAGING_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$STAGING_SUPABASE_URL/rest/v1/rpc/gs_menu_public_catalog" >/dev/null; then
            echo "::error::Staging public Menu RPC is unavailable; no testable artifact was produced."
            exit 1
          fi

      - name: Build candidate against isolated staging only
        if: steps.staging_config.outputs.available == 'true'
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.STAGING_SUPABASE_EXPECTED_PROJECT_REF }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --dart-define="APP_RELEASE_VERSION=1.0.0.13" \
            --dart-define="SUPABASE_URL=$STAGING_SUPABASE_URL" \
            --dart-define="SUPABASE_EXPECTED_PROJECT_REF=$STAGING_SUPABASE_EXPECTED_PROJECT_REF" \
            --dart-define="SUPABASE_ANON_KEY=$STAGING_SUPABASE_ANON_KEY"

      - name: Write and verify canonical staging release metadata
        if: steps.staging_config.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/web")
          version = Path("release/VERSION").read_text(encoding="utf-8").strip()
          if version != "1.0.0.13":
              raise SystemExit("Staging candidate version does not match release/VERSION.")
          mains = [p for p in root.glob("main*.js")
                   if p.name == "main.dart.js" or (p.name.startswith("main.") and p.name.endswith(".dart.js"))]
          if len(mains) != 1:
              raise SystemExit(f"Expected one Flutter main JS bundle, found {len(mains)}.")
          main = mains[0]
          content = main.read_bytes()
          if version.encode() not in content:
              raise SystemExit("Built JavaScript does not contain the staging release version.")
          flutter_version = subprocess.check_output(["flutter", "--version"], text=True).splitlines()[0]
          release = {
              "version": version,
              "main": main.name,
              "sha256": hashlib.sha256(content).hexdigest(),
              "built_with": flutter_version,
          }
          (root / "release.json").write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")
          (root / "release-version.txt").write_text(version + "\n", encoding="utf-8")
          (root / ".nojekyll").touch()
          version_path = root / "version.json"
          version_metadata = json.loads(version_path.read_text(encoding="utf-8"))
          version_metadata["version"] = version
          version_path.write_text(json.dumps(version_metadata, separators=(",", ":")) + "\n", encoding="utf-8")
          if json.loads((root / "release.json").read_text(encoding="utf-8"))["version"] != version:
              raise SystemExit("release.json version mismatch.")
          if json.loads(version_path.read_text(encoding="utf-8"))["version"] != version:
              raise SystemExit("version.json version mismatch.")
          if (root / "release-version.txt").read_text(encoding="utf-8").strip() != version:
              raise SystemExit("release-version.txt mismatch.")
          if hashlib.sha256((root / main.name).read_bytes()).hexdigest() != release["sha256"]:
              raise SystemExit("Staging JavaScript SHA-256 mismatch.")
          PY

      - name: Upload isolated staging artifact
        if: steps.staging_config.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gelye-cafe-rest-1.0.0.13-tables-staging-web
          path: build/web/
          if-no-files-found: error
          retention-days: 1
