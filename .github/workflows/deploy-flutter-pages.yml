name: Deploy Flutter web app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "flutter_app/**"
      - ".github/workflows/deploy-flutter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze and test
        working-directory: flutter_app
        run: |
          flutter analyze
          flutter test

      - name: Build web app
        working-directory: flutter_app
        env:
          SUPABASE_URL: https://axiyxffuagraoydvzicr.supabase.co
          SUPABASE_EXPECTED_PROJECT_REF: axiyxffuagraoydvzicr
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_4hoWIw02Uqx5_5WYJxH-Rw_iG7WlLXQ
        run: |
          flutter build web --release --base-href / \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_EXPECTED_PROJECT_REF="$SUPABASE_EXPECTED_PROJECT_REF" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Version Flutter entrypoint assets
        working-directory: flutter_app/build/web
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          versioned_main="main.${DEPLOY_SHA}.dart.js"
          mv main.dart.js "$versioned_main"
          sed -i "s/main\\.dart\\.js/${versioned_main}/g" flutter_bootstrap.js
          sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${DEPLOY_SHA}|g" index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
