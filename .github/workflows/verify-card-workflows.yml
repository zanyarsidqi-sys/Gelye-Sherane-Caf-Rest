name: Verify card workflows
on:
  push:
    branches: [codex/table-card-workflows]
  pull_request:
    paths: ['flutter_app/**', 'supabase/migrations/**', 'review/*contract-test.sql', '.github/workflows/verify-card-workflows.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter analyze
        working-directory: flutter_app
      - run: flutter test
        working-directory: flutter_app
      - run: flutter build web --release
        working-directory: flutter_app
  task-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: task_workflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: contract-test-only
      PGDATABASE: task_workflow_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f review/table-task-contract-test.sql -f review/people-workflow-contract-test.sql -f review/inventory-contract-test.sql -f review/minibar-contract-test.sql
